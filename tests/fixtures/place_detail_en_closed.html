<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Old Fruit Shop - Google Maps</title></head>
<body>
<!-- Khung chi tiết NGHÈO NÀN nhất mà thực tế vẫn gặp (hl=en):
     đã đóng cửa vĩnh viễn, không SĐT, không website, không bảng giờ và không nút "oh".
     Đây là ca chứng minh scraper không vỡ khi thiếu gần hết selector. -->
<div role="main">
  <h1>Old Fruit Shop</h1>
  <div>
    <span><span aria-hidden="true">3.9</span><span role="img" aria-label="3.9 stars"></span></span>
    <span><span aria-label="87 reviews">(87)</span></span>
  </div>
  <div><span>Permanently closed</span></div>
  <button jsaction="pane.rating.category">Fruit store</button>
  <button data-item-id="address" aria-label="Address: 45 Nguyen Hue, District 1">45 Nguyen Hue</button>
  <!-- không phone:tel:, không authority, không table -->
</div>
</body>
</html>
