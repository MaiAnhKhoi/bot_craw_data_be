; LUU Y: file .ini nay bi configparser doc bang encoding he thong (cp1252 tren Windows)
; nen comment o day KHONG duoc dung tieng Viet co dau.
; Alembic migration la nguon chuan cua schema. Cam goi Base.metadata.create_all().
; URL ket noi lay tu BCD_DATABASE_URL trong migrations/env.py, khong dat o day.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
